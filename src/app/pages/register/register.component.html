<div class="register-container">
    <h1>Nuevo Usuario</h1>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <mat-form-field appearance="outline">
            <mat-label>Nombre completo</mat-label>
            <input matInput formControlName="name" required>
            <mat-error *ngIf="registerForm.get('name')?.hasError('required')">
                Nombre es requerido
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Teléfono</mat-label>
            <input matInput formControlName="phone" type="tel" required>
            <mat-error *ngIf="registerForm.get('phone')?.hasError('required')">
                Teléfono es requerido
            </mat-error>
            <mat-error *ngIf="registerForm.get('phone')?.hasError('pattern')">
                Ingresa un teléfono válido (7-15 dígitos)
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" required>
            <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
                Email es requerido
            </mat-error>
            <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                Ingresa un email válido
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Años de experiencia</mat-label>
            <input matInput formControlName="experience" type="number" min="0" required>
            <mat-error *ngIf="registerForm.get('experience')?.hasError('required')">
                Experiencia es requerida
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Cuéntanos más...</mat-label>
            <textarea matInput formControlName="description" rows="4" required></textarea>
            <mat-error *ngIf="registerForm.get('description')?.hasError('required')">
                Descripción es requerida
            </mat-error>
        </mat-form-field>

        <div class="form-actions">
            <button mat-raised-button type="button" (click)="goBack()">Atrás</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="!registerForm.valid">Registrar</button>
        </div>
    </form>
</div>
