<mat-card *ngIf="user" class="user-preview-card">
    <mat-card-header>
        <div class="mat-card-header-text">
            <img mat-card-avatar [src]="user.avatar" [alt]="user.name">
            <div class="info-user-container">
                <mat-card-title>{{ user.name }}</mat-card-title>
                <mat-card-title>{{ user.phone }}</mat-card-title>
                <mat-card-title>{{ user.email }}</mat-card-title>
            </div>
        </div>
        <div class="experience-container">
            <mat-card-title>{{ user.experience }} años de experiencia</mat-card-title>
        </div>
    </mat-card-header>

    <mat-card-content>
        <p>{{ user.description }}</p>
    </mat-card-content>
</mat-card>
<mat-card-title *ngIf="!user" class="no-user-selected">
    <p>Selecciona un usuario para ver su información</p>
</mat-card-title>
